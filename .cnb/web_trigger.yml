.tags: &tags
  name: 节点类型
  description: L40 节点消耗云原生开发-GPU额度，CPU节点消耗云原生开发-CPU额度
  required: true
  type: select
  default: cnb:arch:amd64:gpu:L40
  options:
    - name: L40 48GB显存 消耗 16核时/小时
      value: cnb:arch:amd64:gpu:L40
    - name: CPU 节点（无 GPU，仅用于调试配置）
      value: cnb:arch:amd64

branch:
  - buttons:
      - name: 启动 L40 预装环境
        event: web_trigger_classic
        isDefault: true
        openWorkspace: true
        inputs:
          tags:
            <<: *tags
      - name: 启动 DIY 环境
        event: web_trigger_diy
        openWorkspace: true
        inputs:
          tags:
            <<: *tags
