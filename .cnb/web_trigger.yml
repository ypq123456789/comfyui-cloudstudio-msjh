.custom_image: &custom_image
  name: 自定义镜像来源
  required: true
  type: select
  default: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/${CNB_BRANCH}-${ENV_MODE}
  options:
    - name: 当前仓库分支里的自定义镜像
      value: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/${CNB_BRANCH}-${ENV_MODE}
    - name: cnb-xu提供，基础镜像，适合全新DIY
      value: $cnb_xu_docker_path/comfyui-diy
    - name: cnb-xu提供，开发镜像，预装大量插件
      value: $cnb_xu_docker_path/comfyui-dev

.tags: &tags
  name: 节点类型
  description: H20、L40节点消耗 云原生开发-GPU 额度，CPU节点消耗 云原生开发-CPU 额度
  required: true
  type: select
  default: cnb:arch:amd64:gpu:H20
  options:
    - name: H20 96GB显存 消耗 32核时/小时
      value: cnb:arch:amd64:gpu:H20
    - name: L40 48GB显存 消耗 16核时/小时
      value: cnb:arch:amd64:gpu:L40
    - name: CPU 16GB内存 消耗 8核时/小时
      value: cnb:arch:amd64

branch:
  - buttons:
      - name: 启动 H20 预装环境
        event: web_trigger_classic
        isDefault: true
        openWorkspace: true
        inputs:
          tags:
            <<: *tags
      - name: 启动 DIY 环境
        event: web_trigger_diy
        openWorkspace: true
        inputs:
          tags:
            <<: *tags
          custom_image:
            <<: *custom_image